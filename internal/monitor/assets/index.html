<link rel="stylesheet" href="/assets/css/base.css">

<script src="/assets/js/refresh-sources.js" defer></script>
<script src="/assets/js/data-transfer.js" defer></script>
<script src="/assets/js/main.js" defer></script>
</head>
<body>

  <symbol id="i-import" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
  <symbol id="i-server" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01M6 18h.01"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></symbol>

  <symbol id="i-network" viewBox="0 0 24 24"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3M12 12V8"/></symbol>
  <symbol id="i-logs" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8"/></symbol>

<div class="app" id="app">
  <aside class="side">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div class="brand-text"><strong>Easy Proxies</strong><span>代理池管理</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主导航"></nav>
    <div class="side-status" id="sideStatus" aria-live="polite"></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn" type="button" onclick="toggleSidebar()" title="折叠侧栏" aria-label="折叠侧栏"><svg class="icon"><use href="#i-panel"/></svg></button>
      <div class="crumbs" aria-hidden="true"><span id="crumbGroup">概览</span><span class="sep">/</span><strong id="crumbTitle">仪表盘</strong></div>
      <h1 id="pageTitle" class="sr-only">仪表盘</h1>
      <div class="top-actions">
        <div id="globalRefreshStatus" class="global-refresh-slot"></div>
        <button class="icon-btn" id="topRefresh" type="button" onclick="refreshCurrentPage()" title="刷新数据" aria-label="刷新数据"><svg class="icon"><use href="#i-refresh"/></svg></button>
        <a class="icon-btn" href="https://github.com/daimon3332/easy-proxies" target="_blank" rel="noopener noreferrer" title="打开 GitHub 仓库" aria-label="打开 Easy Proxies GitHub 仓库"><svg class="icon"><use href="#i-github"/></svg></a>
        <button class="icon-btn" id="logoutButton" type="button" onclick="logout()" title="退出登录" aria-label="退出登录" hidden><svg class="icon"><use href="#i-logout"/></svg></button>
      </div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<div class="modal" id="authModal">
  <form class="dialog auth-dialog" onsubmit="login(event)">
    <div class="logo" aria-hidden="true"></div>
    <h2>登录 Easy Proxies</h2>
    <div class="field"><label for="password">管理密码</label><input id="password" type="password" autocomplete="current-password"></div>
    <p class="status" id="authStatus" aria-live="polite"></p>
    <button class="btn primary block" type="submit">进入管理</button>
  </form>
</div>
<div class="modal" id="resultModal">
  <div class="dialog" id="resultDialog"></div>
</div>
<div class="modal" id="chainProfileModal" role="presentation" onclick="if(event.target===this)closeChainProfileEditor()">
  <div class="dialog chain-dialog" role="dialog" aria-modal="true" aria-labelledby="chainProfileTitle">
    <div class="chain-dialog-head">
      <h2 id="chainProfileTitle">添加前置代理</h2>
      <button class="btn ghost dialog-close" type="button" onclick="closeChainProfileEditor()" aria-label="关闭">×</button>
    </div>
    <div class="chain-dialog-body">
      <input id="chainEditID" type="hidden">
      <div class="field"><label for="chainEditName">名称</label><input id="chainEditName" placeholder="例如：海外入口" autocomplete="off"></div>
      <div class="field"><label for="chainEditURI">节点 URI</label><textarea id="chainEditURI" placeholder="vless://...&#10;hysteria2://...&#10;socks5://..."></textarea></div>
      <label class="toggle-row"><input id="chainEditEnabled" type="checkbox" checked><div><strong>启用</strong></div></label>
      <div id="chainEditStatus" class="inline-status" aria-live="polite"></div>
    </div>
    <div class="chain-dialog-actions">
      <button class="btn ghost" type="button" onclick="closeChainProfileEditor()">取消</button>
      <button class="btn secondary" id="chainTestButton" type="button" onclick="testChainProfileDraft()">测试连接</button>
      <button class="btn primary" id="chainSaveButton" type="button" onclick="saveChainProfileDraft()">保存</button>
    </div>
  </div>
</div>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>
</body>
</html>
